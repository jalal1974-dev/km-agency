name: Publish website source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract production source
        run: |
          unzip -o KM-Agency-Production-UNIX.zip
          rm KM-Agency-Production-UNIX.zip

      - name: Commit website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish KM Agency production website"
          git push
